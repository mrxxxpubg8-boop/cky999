<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杀组28 @SZ28BOT</title>
<style>
body { font-family: Arial, sans-serif; text-align:center; background:#f8f8f8; margin:0; padding:0; }
h1 { margin-top:20px; font-size:26px; font-weight:bold; }
button { padding:6px 12px; cursor:pointer; font-size:16px; }
#passwordOverlay { position:fixed; inset:0; background:#f8f8f8; display:flex; justify-content:center; align-items:center; flex-direction:column; z-index:9999; }
#passwordOverlay input { padding:10px; font-size:18px; }
#passwordError { color:red; margin-top:10px; }
#mainControls { display:flex; justify-content:center; gap:10px; margin:15px 0; flex-wrap:wrap; }
#infoBoxes { display:flex; justify-content:center; gap:15px; margin-bottom:15px; flex-wrap:wrap; }
.infoBox { background:#e0f0ff; padding:10px 16px; border-radius:10px; font-size:18px; font-weight:bold; }
table { border-collapse: collapse; margin:auto; width:95%; background:#fff; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; font-weight:bold; }
th { background:#eee; }
.correct { color: green; }
.wrong { color: red; }
footer { margin:15px auto; font-size:28px; font-weight:bold; color:#fff; background:#1e3c72; padding:12px; border-radius:12px; width:95%; }
#versionInfo { font-size:16px; }
</style>
</head>
<body>

<div id="passwordOverlay">
  <h2>请输入访问密码</h2>
  <input type="password" id="passwordInput" placeholder="密码">
  <button onclick="checkPassword()">提交</button>
  <p id="passwordError"></p>
</div>

<div id="mainContent" style="display:none;">
  <h1>杀组28 @SZ28BOT</h1>
  <div id="mainControls">
    <select id="algorithmSelect">
      <option value="1">算法1</option>
      <option value="2">算法2</option>
    </select>
    <button onclick="loadData()">刷新</button>
  </div>

  <div id="infoBoxes">
    <div class="infoBox" id="nextPred">加载中...</div>
    <div class="infoBox" id="winRate">加载中...</div>
  </div>

  <h3>最近 50 期预测</h3>
  <table id="historyTable">
    <tr><th>期号</th><th>预测</th><th>和值</th><th>结果</th></tr>
  </table>

  <footer>
    BY CKY @cky_nb
    <div id="versionInfo">杀组28 v1.1.9.2</div>
  </footer>
</div>

<script>
// ==== 密码验证 ====
const passwordList = ["sz28test1","sz28test2","sz28test3"];
function checkPassword(){
  const pw = document.getElementById('passwordInput').value;
  if(passwordList.includes(pw)){
    localStorage.setItem('sz28_pass','1');
    document.getElementById('passwordOverlay').style.display='none';
    document.getElementById('mainContent').style.display='block';
    loadData();
  } else {
    document.getElementById('passwordError').innerText='密码错误';
  }
}

window.onload = ()=>{
  if(localStorage.getItem('sz28_pass')==='1'){
    document.getElementById('passwordOverlay').style.display='none';
    document.getElementById('mainContent').style.display='block';
    loadData();
  }
};

// ==== 工具函数 ====
const sum = arr => arr.reduce((a,b)=>a+b,0);

function checkWin(pred, total){
  const size = total>=14?'大':'小';
  const parity = total%2?'单':'双';
  return pred==='杀'+size+parity ? '✅':'❌';
}

// ==== 算法函数 ====
function calcAlgorithm1(last3){
  let a = (sum(last3[2])+last3[2][0])/0.28 +
          (sum(last3[1])+last3[1][0])/0.28 +
          (sum(last3[0])+last3[0][0])/0.28;
  let b = Math.sqrt(a)/3;
  let decimal = b.toFixed(3).split('.')[1];
  let digitSum = decimal.split('').reduce((s,d)=>s+parseInt(d),0);
  if(digitSum<14) return digitSum%2?'杀大单':'杀大双';
  return digitSum%2?'杀小单':'杀小双';
}

function calcAlgorithm2(last3){
  let a = (sum(last3[2])+last3[2][0])/4 +
          (sum(last3[1])+last3[1][0])/4 +
          (sum(last3[0])+last3[0][0])/4;
  let b = Math.sqrt(a)/28;
  let decimal = b.toFixed(3).split('.')[1];
  let digitSum = decimal.split('').reduce((s,d)=>s+parseInt(d),0);
  if(digitSum<14) return digitSum%2?'杀小单':'杀小双';
  return digitSum%2?'杀大单':'杀大双';
}

// ==== 获取 JSON ====
async function fetchJSON(url){
  try{
    const resp = await fetch(url,{cache:'no-store'});
    return await resp.json();
  } catch(e){
    console.error(e);
    return null;
  }
}

// ==== 加载数据 ====
async function loadData(){
  document.getElementById('nextPred').innerText='加载中...';
  try{
    const data = await fetchJSON('https://pc28.help/kj.json?limit=60');
    if(!data || !data.data) throw '获取数据失败';

    const recordDict = {};
    data.data.forEach(item=>{
      const qihao = parseInt(item.qihao);
      const nums = item.opennum.split('+').map(Number).slice(0,3);
      if(nums.length>=3) recordDict[qihao] = nums;
    });

    const sortedQihao = Object.keys(recordDict).map(Number).sort((a,b)=>b-a);
    const historyTable = document.getElementById('historyTable');
    historyTable.innerHTML='<tr><th>期号</th><th>预测</th><th>和值</th><th>结果</th></tr>';

    let winCount = 0;
    const testQihaoList = sortedQihao.slice(0,50);
    const selectedAlgo = document.getElementById("algorithmSelect").value;

    for(let curQihao of testQihaoList){
      const prevQihaos = sortedQihao.filter(q=>q<curQihao).slice(0,3);
      if(prevQihaos.length<3) continue;
      const last3 = prevQihaos.map(q=>recordDict[q]);
      let pred = selectedAlgo==='1'?calcAlgorithm1(last3):calcAlgorithm2(last3);
      let total = sum(recordDict[curQihao]);
      if(total<10) total = '0'+total;
      const res = checkWin(pred,total);
      if(res==='✅') winCount++;
      const tr = document.createElement('tr');
      tr.innerHTML=`<td>${curQihao}</td><td>${pred}</td><td>${total}</td><td class="${res==='✅'?'correct':'wrong'}">${res}</td>`;
      historyTable.appendChild(tr);
    }

    document.getElementById('winRate').innerText = `历史胜率: ${(winCount/testQihaoList.length*100).toFixed(1)}%`;

    const latestThree = sortedQihao.slice(0,3).map(q=>recordDict[q]);
    const nextPred = selectedAlgo==='1'?calcAlgorithm1(latestThree):calcAlgorithm2(latestThree);
    document.getElementById('nextPred').innerText=`下一期预测: ${nextPred}`;

  } catch(e){
    document.getElementById('nextPred').innerText='刷新失败';
    console.error(e);
  }
}
</script>
</body>
</html>
