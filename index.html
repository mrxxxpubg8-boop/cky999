<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC28 开奖刮开页</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1b1b1b;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }

    .top {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .title {
      font-size: 14px;
      color: rgba(255,255,255,.65);
    }

    .issue {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }

    .body {
      padding: 28px 20px 20px;
      text-align: center;
    }

    .wrap {
      display: inline-block;
      position: relative;
    }

    .result-text {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 1px;
      color: #fff;
      padding: 10px 16px;
    }

    .mask-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
      border-radius: 14px;
    }

    .actions {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn2 {
      border: 0;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-dark {
      background: rgba(255,255,255,.1);
      color: #fff;
    }

    .btn-light {
      background: #fff;
      color: #111;
    }

    .msg {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,.75);
      text-align: center;
      padding: 20px;
      line-height: 1.6;
    }

    .err {
      color: #ffb4b4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="title">PC28 最新开奖</div>
      <div class="issue" id="issue">加载中</div>
    </div>

    <div class="body">
      <div id="content">
        <div class="msg">正在获取开奖数据...</div>
      </div>
    </div>
  </div>

  <script>
    const content = document.getElementById("content");
    const issueEl = document.getElementById("issue");

    let canvas = null;
    let drawing = false;
    let revealed = false;

    function pad2(n) {
      return String(Number(n)).padStart(2, "0");
    }

    function parseLatest(json) {
      const item = json && json.data && json.data[0];
      if (!item) return null;

      const nums = String(item.number || "0+0+0")
        .replace(/,/g, "+")
        .split("+")
        .map(x => Number(x.trim()))
        .filter(n => !Number.isNaN(n))
        .slice(0, 3);

      if (nums.length !== 3) return null;

      const totalFromApi = Number(item.num);
      const total = Number.isNaN(totalFromApi)
        ? nums[0] + nums[1] + nums[2]
        : totalFromApi;

      return {
        qihao: String(item.nbr || "--"),
        nums,
        total
      };
    }

    function showError(msg) {
      issueEl.textContent = "失败";
      content.innerHTML = `<div class="msg err">获取失败<br>${msg}</div>`;
    }

    function buildResultHtml(data) {
      const resultText = `${data.nums[0]} + ${data.nums[1]} + ${data.nums[2]} = ${pad2(data.total)}`;

      return `
        <div class="wrap" id="scratchWrap">
          <div class="result-text">${resultText}</div>
          <canvas class="mask-canvas" id="scratchCanvas"></canvas>
        </div>

        <div class="actions">
          <button class="btn2 btn-dark" id="revealBtn" type="button">直接揭开</button>
          <button class="btn2 btn-light" id="reloadBtn" type="button">重新加载</button>
        </div>
      `;
    }

    function setupScratch() {
      const wrap = document.getElementById("scratchWrap");
      canvas = document.getElementById("scratchCanvas");

      if (!wrap || !canvas) {
        showError("刮开层初始化失败");
        return;
      }

      const rect = wrap.getBoundingClientRect();
      const dpr = Math.max(window.devicePixelRatio || 1, 1);

      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";

      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      if (!ctx) {
        showError("浏览器不支持 canvas");
        return;
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);

      const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      grad.addColorStop(0, "#9ca3af");
      grad.addColorStop(1, "#6b7280");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, rect.width, rect.height);

      ctx.fillStyle = "rgba(255,255,255,0.15)";
      for (let i = -rect.height; i < rect.width; i += 14) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i + rect.height, rect.height);
        ctx.lineTo(i + rect.height + 6, rect.height);
        ctx.lineTo(i + 6, 0);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.font = "700 16px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Telegram @ii20bot", rect.width / 2, rect.height / 2);

      canvas.onpointerdown = (e) => {
        drawing = true;
        eraseAt(e.clientX, e.clientY);
      };

      canvas.onpointermove = (e) => {
        if (!drawing || revealed) return;
        eraseAt(e.clientX, e.clientY);
      };

      canvas.onpointerup = () => { drawing = false; };
      canvas.onpointerleave = () => { drawing = false; };
      canvas.onpointercancel = () => { drawing = false; };
    }

    function eraseAt(clientX, clientY) {
      if (!canvas) return;

      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      if (!ctx) return;

      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      updateProgress();
    }

    function updateProgress() {
      if (!canvas || revealed) return;

      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      if (!ctx) return;

      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      let cleared = 0;
      for (let i = 3; i < data.length; i += 4 * 10) {
        if (data[i] < 20) cleared++;
      }

      const total = Math.max(1, Math.floor(data.length / (4 * 10)));
      const percent = Math.min(100, Math.round((cleared / total) * 100));

      if (percent >= 55) {
        revealAll();
      }
    }

    function revealAll() {
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      revealed = true;
    }

    async function loadData() {
      revealed = false;
      canvas = null;
      drawing = false;

      issueEl.textContent = "加载中";
      content.innerHTML = `<div class="msg">正在获取开奖数据...</div>`;

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);

        const res = await fetch("https://pc28.help/api/kj.json?nbr=1", {
          cache: "no-store",
          signal: controller.signal
        });

        clearTimeout(timer);

        if (!res.ok) {
          throw new Error("请求失败：" + res.status);
        }

        const json = await res.json();
        const data = parseLatest(json);

        if (!data) {
          throw new Error("开奖数据格式异常");
        }

        issueEl.textContent = `${data.qihao} 期`;
        content.innerHTML = buildResultHtml(data);

        document.getElementById("revealBtn").onclick = revealAll;
        document.getElementById("reloadBtn").onclick = loadData;

        requestAnimationFrame(() => {
          setupScratch();
        });
      } catch (e) {
        const msg = e && e.name === "AbortError"
          ? "请求超时"
          : (e && e.message ? e.message : String(e));
        showError(msg);
      }
    }

    loadData();
  </script>
</body>
</html>
