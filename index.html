<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杀组28 @SZ28BOT</title>
<style>
body { font-family: Arial, sans-serif; text-align:center; background:#f8f8f8; margin:0; padding:0; }
h1 { margin-top:20px; font-size:26px; font-weight:bold; }
button { padding:6px 12px; cursor:pointer; font-size:16px; }
#passwordOverlay {
  position:fixed; inset:0; background:#f8f8f8;
  display:flex; justify-content:center; align-items:center;
  flex-direction:column; z-index:9999;
}
#passwordOverlay input { padding:10px; font-size:18px; }
#passwordError { color:red; margin-top:5px; }
#mainControls { display:flex; justify-content:center; gap:10px; margin:15px 0; flex-wrap:wrap; }
#infoBoxes { display:flex; justify-content:center; gap:15px; margin-bottom:15px; flex-wrap:wrap; }
.infoBox { background:#e0f0ff; padding:10px 16px; border-radius:10px; font-size:18px; font-weight:bold; }
table { border-collapse: collapse; margin:auto; width:95%; background:#fff; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; font-weight:bold; }
th { background:#eee; }
.correct { color: green; }
.wrong { color: red; }
footer { margin:15px auto; font-size:28px; font-weight:bold; color:#fff; background:#1e3c72; padding:12px; border-radius:12px; width:95%; }
#versionInfo { font-size:16px; }
</style>
</head>
<body>

<!-- 密码覆盖层 -->
<div id="passwordOverlay">
  <h2>请输入访问密码</h2>
  <input type="password" id="passwordInput" placeholder="密码">
  <button onclick="checkPassword()">提交</button>
  <p id="passwordError"></p>
</div>

<!-- 主内容 -->
<div id="mainContent" style="display:none;">
  <h1>杀组28 @SZ28BOT</h1>
  <div id="mainControls">
    <select id="algorithmSelect">
      <option value="1">算法1</option>
      <option value="2">算法2</option>
    </select>
    <button onclick="loadData()">刷新预测</button>
  </div>

  <div id="infoBoxes">
    <div class="infoBox" id="nextPred">加载中...</div>
    <div class="infoBox" id="winRate">加载中...</div>
  </div>

  <h3>最近 50 期</h3>
  <table id="historyTable">
    <tr><th>期号</th><th>预测</th><th>和值</th><th>结果</th></tr>
  </table>

  <footer>
    BY CKY @cky_nb
    <div id="versionInfo">杀组28 v1.1.9.1</div>
  </footer>
</div>

<script>
/* ===== 安全密码 ===== */
const passwordList = ["sz28test1","sz28test2","sz28test3"]; 

function checkPassword(){
  const pw = document.getElementById('passwordInput').value;
  if(passwordList.includes(pw)){
    localStorage.setItem('sz28_pass','1');
    document.getElementById('passwordOverlay').style.display='none';
    document.getElementById('mainContent').style.display='block';
    loadData();
  }else{
    document.getElementById('passwordError').innerText='密码错误';
  }
}

window.onload = ()=>{
  if(localStorage.getItem('sz28_pass')==='1'){
    document.getElementById('passwordOverlay').style.display='none';
    document.getElementById('mainContent').style.display='block';
    loadData();
  }
};

/* ===== 工具函数 ===== */
const sum = a => a.reduce((x,y)=>x+y,0);

function checkWin(pred, total){
  const size = total>=14?'大':'小';
  const parity = total%2?'单':'双';
  return pred !== ('杀'+size+parity) ? '✅':'❌';
}

/* ===== 算法 ===== */
function calcAlgorithm(last3, k){
  let a = last3.reduce((s, n)=>s+(sum(n)+n[0])/k, 0);
  let d = Math.sqrt(a)/k;
  let decimal = (d % 1).toFixed(3).substring(2); // 小数部分
  let digitSum = [...decimal].reduce((s, n)=>s + parseInt(n), 0);
  if(digitSum < 14) return digitSum%2 ? '杀大单':'杀大双';
  return digitSum%2 ? '杀小单':'杀小双';
}

/* ===== 获取 JSON ===== */
async function fetchJSON(url){
  try{
    const resp = await fetch(`${url}&_=${Date.now()}`, { cache:'no-store' });
    return await resp.json();
  }catch(e){ console.error(e); return null; }
}

/* ===== 加载数据 ===== */
async function loadData(){
  document.getElementById('nextPred').innerText='加载中…';
  try{
    const data = await fetchJSON('https://pc28.help/kj.json?limit=120');
    if(!data?.data) throw 'API结构错误';

    const recordDict = {};
    data.data.forEach(item=>{
      if(!item.qihao || !item.opennum) return;
      const nums = item.opennum.split('+').map(Number);
      if(nums.length!==3 || nums.some(isNaN)) return;
      recordDict[+item.qihao] = nums;
    });

    const sortedQihao = Object.keys(recordDict).map(Number).sort((a,b)=>b-a);
    const historyTable = document.getElementById('historyTable');
    historyTable.innerHTML = '<tr><th>期号</th><th>预测</th><th>和值</th><th>结果</th></tr>';

    let win = 0;
    const algoId = document.getElementById('algorithmSelect').value==='1'?28:4;

    sortedQihao.slice(0,50).forEach(cur=>{
      const prevQihao = sortedQihao.filter(q=>q<cur).slice(0,3);
      if(prevQihao.length<3) return;
      const last3 = prevQihao.map(q=>recordDict[q]);
      const pred = calcAlgorithm(last3, algoId);
      let total = sum(recordDict[cur]);
      if(total < 10) total = '0'+total;
      const res = checkWin(pred,total);
      if(res==='✅') win++;
      historyTable.insertAdjacentHTML('beforeend', 
        `<tr><td>${cur}</td><td>${pred}</td><td>${total}</td><td class="${res==='✅'?'correct':'wrong'}">${res}</td></tr>`
      );
    });

    document.getElementById('winRate').innerText = `胜率 ${(win/50*100).toFixed(1)}%`;
    const nextPred = calcAlgorithm(sortedQihao.slice(0,3).map(q=>recordDict[q]), algoId);
    document.getElementById('nextPred').innerText = `下一期预测：${nextPred}`;

  }catch(e){
    console.error(e);
    document.getElementById('nextPred').innerText='加载失败';
  }
}

/* ===== 自动刷新 ===== */
setInterval(loadData, 5000); // 每5秒刷新一次
</script>
</body>
</html>
