<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC28 开奖刮开页</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1b1b1b;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.08);
    }
    .top {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 14px;
      color: rgba(255,255,255,.65);
    }
    .issue {
      font-size: 24px;
      font-weight: bold;
      margin-top: 4px;
    }
    .btn {
      border: 0;
      background: #fff;
      color: #111;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .body {
      padding: 20px;
    }
    .hint {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
      color: rgba(255,255,255,.7);
    }
    .scratch-wrap {
      position: relative;
      height: 260px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #111;
    }
    .result {
      position: absolute;
      inset: 0;
      padding: 22px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .result-top {
      color: rgba(0,0,0,.6);
      font-size: 12px;
      letter-spacing: .2em;
    }
    .result-main {
      text-align: center;
    }
    .result-text {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.2;
    }
    .sub {
      margin-top: 10px;
      color: rgba(0,0,0,.65);
      font-size: 14px;
    }
    .balls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .ball {
      background: rgba(0,0,0,.08);
      border-radius: 18px;
      padding: 12px 8px;
      text-align: center;
    }
    .ball-label {
      font-size: 12px;
      color: rgba(0,0,0,.6);
    }
    .ball-value {
      margin-top: 4px;
      font-size: 22px;
      font-weight: bold;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn2 {
      border: 0;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-dark {
      background: rgba(255,255,255,.1);
      color: #fff;
    }
    .btn-light {
      background: #fff;
      color: #111;
    }
    .msg {
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,.75);
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <div class="title">PC28 最新开奖</div>
        <div class="issue" id="issue">加载中</div>
      </div>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div class="body">
      <div id="content"></div>
    </div>
  </div>

  <script>
    const content = document.getElementById("content");
    const issueEl = document.getElementById("issue");
    const refreshBtn = document.getElementById("refreshBtn");

    let revealed = false;
    let progress = 0;
    let canvas = null;
    let drawing = false;

    function pad2(n) {
      return String(Number(n)).padStart(2, "0");
    }

    function parseLatest(json) {
      const item = json?.data?.[0];
      if (!item) return null;

      const nums = String(item.number || "0+0+0")
        .replace(/,/g, "+")
        .split("+")
        .map(x => Number(x.trim()))
        .filter(n => !Number.isNaN(n))
        .slice(0, 3);

      if (nums.length !== 3) return null;

      const total = Number.isNaN(Number(item.num))
        ? nums[0] + nums[1] + nums[2]
        : Number(item.num);

      return {
        qihao: String(item.nbr || "--"),
        nums,
        total
      };
    }

    async function loadData() {
      revealed = false;
      progress = 0;
      issueEl.textContent = "加载中";
      content.innerHTML = `<div class="msg">正在获取开奖数据...</div>`;

      try {
        const res = await fetch("https://pc28.help/api/kj.json?nbr=1", { cache: "no-store" });
        if (!res.ok) throw new Error("请求失败：" + res.status);

        const json = await res.json();
        const data = parseLatest(json);
        if (!data) throw new Error("开奖数据格式异常");

        issueEl.textContent = `${data.qihao} 期`;

        const resultText = `${data.nums[0]} + ${data.nums[1]} + ${data.nums[2]} = ${pad2(data.total)}`;

        content.innerHTML = `
          <div class="hint">
            <span>刮开查看本期号码</span>
            <span id="percentText">已刮开 0%</span>
          </div>

          <div class="scratch-wrap" id="scratchWrap">
            <div class="result">
              <div>
                <div class="result-top">OPEN RESULT</div>
                <div style="margin-top:8px;font-size:18px;font-weight:bold;">${data.qihao} 期开奖结果</div>
              </div>

              <div class="result-main">
                <div class="result-text">${resultText}</div>
                <div class="sub">只有总和补 0</div>
              </div>

              <div class="balls">
                <div class="ball">
                  <div class="ball-label">A球</div>
                  <div class="ball-value">${data.nums[0]}</div>
                </div>
                <div class="ball">
                  <div class="ball-label">B球</div>
                  <div class="ball-value">${data.nums[1]}</div>
                </div>
                <div class="ball">
                  <div class="ball-label">C球</div>
                  <div class="ball-value">${data.nums[2]}</div>
                </div>
                <div class="ball">
                  <div class="ball-label">和值</div>
                  <div class="ball-value">${pad2(data.total)}</div>
                </div>
              </div>
            </div>
            <canvas id="scratchCanvas"></canvas>
          </div>

          <div class="actions">
            <button class="btn2 btn-dark" id="revealBtn">直接揭开</button>
            <button class="btn2 btn-light" id="reloadBtn">重新加载</button>
          </div>
        `;

        setupScratch();
        document.getElementById("revealBtn").onclick = revealAll;
        document.getElementById("reloadBtn").onclick = loadData;

      } catch (e) {
        content.innerHTML = `<div class="msg">获取失败<br>${e.message}</div>`;
        issueEl.textContent = "失败";
      }
    }

    function setupScratch() {
      const wrap = document.getElementById("scratchWrap");
      canvas = document.getElementById("scratchCanvas");
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.max(window.devicePixelRatio || 1, 1);

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      grad.addColorStop(0, "#9ca3af");
      grad.addColorStop(1, "#6b7280");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, rect.width, rect.height);

      ctx.fillStyle = "rgba(255,255,255,.18)";
      for (let i = -rect.height; i < rect.width; i += 18) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i + rect.height, rect.height);
        ctx.lineTo(i + rect.height + 8, rect.height);
        ctx.lineTo(i + 8, 0);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.font = "700 22px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("刮开奖遮罩", rect.width / 2, rect.height / 2 - 14);

      ctx.font = "500 13px sans-serif";
      ctx.fillText("手指或鼠标刮开查看结果", rect.width / 2, rect.height / 2 + 16);

      canvas.onpointerdown = (e) => {
        drawing = true;
        eraseAt(e.clientX, e.clientY);
      };
      canvas.onpointermove = (e) => {
        if (!drawing || revealed) return;
        eraseAt(e.clientX, e.clientY);
      };
      canvas.onpointerup = () => drawing = false;
      canvas.onpointer// 转换数据格式
function parseRecord(item) {
    const qihao = parseInt(item.qihao);
    const nums = item.opennum.replace(/,/g, "+").split("+").map(Number).slice(0, 3);
    return { qihao, nums };
}

// 杀组①预测公式
function calcPrediction1(last3_nums) {
    if (last3_nums.length < 3) return null;
    let a = (sum(last3_nums[2]) + last3_nums[2][0])/0.28 +
            (sum(last3_nums[1]) + last3_nums[1][0])/0.28 +
            (sum(last3_nums[0]) + last3_nums[0][0])/0.28;
    let b = Math.sqrt(a);
    let c = b / 3;
    let decimal_part = c.toFixed(3).split(".")[1];
    let digit_sum = decimal_part.split("").reduce((acc,d)=>acc+parseInt(d),0);
    if (digit_sum < 14) return digit_sum % 2 === 0 ? "杀大双" : "杀大单";
    else return digit_sum % 2 === 0 ? "杀小双" : "杀小单";
}

// 杀组②预测公式
function calcPrediction2(last3_nums) {
    if (last3_nums.length < 3) return null;
    let a = (sum(last3_nums[2]) + last3_nums[2][0])/4 +
            (sum(last3_nums[1]) + last3_nums[1][0])/4 +
            (sum(last3_nums[0]) + last3_nums[0][0])/4;
    let b = Math.sqrt(a);
    let c = b / 28;
    let decimal_part = c.toFixed(3).split(".")[1];
    let digit_sum = decimal_part.split("").reduce((acc,d)=>acc+parseInt(d),0);
    if (digit_sum < 14) return digit_sum % 2 === 0 ? "杀小双" : "杀小单";
    else return digit_sum % 2 === 0 ? "杀大双" : "杀大单";
}

// 辅助函数
function sum(arr) { return arr.reduce((a,b)=>a+b,0); }
function checkWin(pred, total_sum) {
    const size = total_sum >= 14 ? "大" : "小";
    const parity = total_sum % 2 === 1 ? "单" : "双";
    const comb = size + parity;
    if (pred === "杀小单" && comb !== "小单") return "✅";
    if (pred === "杀小双" && comb !== "小双") return "✅";
    if (pred === "杀大单" && comb !== "大单") return "✅";
    if (pred === "杀大双" && comb !== "大双") return "✅";
    return "❌";
}

// 主预测函数
async function runPrediction(type) {
    document.getElementById("output").textContent = "加载中...";
    const raw = await fetchHistory(QIHAO_COUNT + 20);
    if (!raw.length) { document.getElementById("output").textContent = "获取历史数据失败"; return; }
    
    const record_dict = {};
    raw.forEach(item => {
        const r = parseRecord(item);
        if (r.nums.length === 3) record_dict[r.qihao] = r.nums;
    });
    
    const sorted_qihao = Object.keys(record_dict).map(Number).sort((a,b)=>a-b);
    if (sorted_qihao.length < 6) { document.getElementById("output").textContent = "历史数据不足"; return; }

    const results = [];
    let win_count = 0;
    const test_qihao_list = sorted_qihao.slice(-QIHAO_COUNT);
    
    for (const cur_qihao of test_qihao_list) {
        const prev = sorted_qihao.filter(q => q < cur_qihao);
        if (prev.length < 3) continue;
        const last3_nums = prev.slice(-3).map(q=>record_dict[q]);
        const pred = type===1 ? calcPrediction1(last3_nums) : calcPrediction2(last3_nums);
        const total_sum = sum(record_dict[cur_qihao]);
        const res = checkWin(pred,total_sum);
        if (res === "✅") win_count++;
        results.push(`${cur_qihao}期 ${pred} 开奖${String(total_sum).padStart(2,'0')} ${res}`);
    }

    // 下一期预测
    const last3_for_next = sorted_qihao.slice(-3).map(q=>record_dict[q]);
    const next_pred = type===1 ? calcPrediction1(last3_for_next) : calcPrediction2(last3_for_next);
    const next_qihao = Math.max(...sorted_qihao)+1;
    const win_rate = (win_count / results.length *100).toFixed(1);

    const reply = `最新${next_qihao}期预测: ${next_pred}\n历史胜率: ${win_rate}% (${win_count}/${results.length})\n\n` +
                  results.reverse().join("\n") +
                  `\n\n仅供参考，不保证准确`;
    
    document.getElementById("output").textContent = reply;
}
</script>

<body>

<!-- 密码层 -->
<div id="passwordOverlay">
  <h2>请输入访问密码</h2>
  <input type="password" id="passwordInput" placeholder="密码">
  <button onclick="checkPassword()">提交</button>
  <p id="passwordError"></p>
</div>

<!-- 主内容 -->
<div id="mainContent" style="display:none;">
  <h1>杀组28 @SZ28BOT</h1>

  <div id="mainControls">
    <select id="algorithmSelect">
      <option value="1">算法1</option>
      <option value="2">算法2</option>
    </select>
    <button onclick="loadData()">刷新</button>
  </div>

  <div id="infoBoxes">
    <div class="infoBox" id="nextPred">加载中...</div>
    <div class="infoBox" id="winRate">加载中...</div>
  </div>

  <h3>最近 60 期</h3>
  <table id="historyTable">
    <tr><th>期号</th><th>预测</th><th>和值</th><th>结果</th></tr>
  </table>

  <footer>
    未来集团 @wljtjj
    <div id="versionInfo">杀组28 v1.1.9.2</div>
  </footer>
</div>

<script>
/* ===== 密码 ===== */
const passwordList = ["sz28test1","sz28test2","sz28test3"];

function checkPassword(){
  const pw = document.getElementById('passwordInput').value;
  if(passwordList.includes(pw)){
    localStorage.setItem('sz28_pass','1');
    showMain();
  }else{
    document.getElementById('passwordError').innerText='密码错误';
  }
}

function showMain(){
  document.getElementById('passwordOverlay').style.display='none';
  document.getElementById('mainContent').style.display='block';
  loadData();
}

window.onload = ()=>{
  if(localStorage.getItem('sz28_pass')==='1'){
    showMain();
  }
};

/* ===== 工具函数 ===== */
const sum = a => a.reduce((x,y)=>x+y,0);

function checkWin(pred,total){
  const size = total>=14?'大':'小';
  const parity = total%2?'单':'双';
  return pred !== '杀'+size+parity ? '✅' : '❌';
}

function algo(last3,k){
  let a = last3.reduce((s,n)=>s+(sum(n)+n[0])/k,0);
  let d = Math.sqrt(a)/k;
  let ds = d.toFixed(3).split('.')[1].split('').reduce((s,n)=>s+ +n,0);
  if(ds<14) return ds%2?'杀大单':'杀大双';
  return ds%2?'杀小单':'杀小双';
}

/* ===== 加载数据（60期，无代理） ===== */
async function loadData(){
  const nextPredEl = document.getElementById('nextPred');
  nextPredEl.innerText = '加载中...';
  try{
    const r = await fetch('https://pc28.help/kj.json?limit=60&_=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) throw `HTTP错误 ${r.status}`;
    const j = await r.json();
    if(!j.data || !Array.isArray(j.data)) throw 'API结构错误';

    const map = {};
    j.data.forEach(i=>{
      if(!i.qihao || !i.opennum) return;
      const nums = i.opennum.split('+').map(Number);
      if(nums.length!==3 || nums.some(isNaN)) return;
      map[+i.qihao] = nums;
    });

    const q = Object.keys(map).map(Number).sort((a,b)=>b-a);
    const tbl = document.getElementById('historyTable');
    tbl.innerHTML='<tr><th>期号</th><th>预测</th><th>和值</th><th>结果</th></tr>';

    let win = 0;
    const algoId = document.getElementById('algorithmSelect').value==='1'?28:4;

    q.slice(0,60).forEach(cur=>{
      const p = q.filter(x=>x<cur).slice(0,3);
      if(p.length<3) return;
      const last3 = p.map(x=>map[x]);
      const pred = algo(last3, algoId);
      let total = sum(map[cur]);
      if(total<10) total = '0'+total;
      const res = checkWin(pred, parseInt(total));
      if(res==='✅') win++;
      tbl.insertAdjacentHTML('beforeend',
        `<tr><td>${cur}</td><td>${pred}</td><td>${total}</td>
         <td class="${res==='✅'?'correct':'wrong'}">${res}</td></tr>`);
    });

    document.getElementById('winRate').innerText=`胜率 ${(win/60*100).toFixed(1)}%`;
    const next = algo(q.slice(0,3).map(x=>map[x]), algoId);
    nextPredEl.innerText = `最新期预测：${next}`;

  }catch(e){
    console.error(e);
    nextPredEl.innerText='加载失败';
  }
}
</script>
