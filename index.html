<!DOCTYPE html><html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杀组28 @SZ28BOT</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f6f6;margin:0;text-align:center}
h1{margin:16px 0;font-size:26px}
button,select,input{font-size:16px;padding:6px 10px}
#passwordOverlay{position:fixed;inset:0;background:#f6f6f6;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999}
#passwordError{color:red;margin-top:8px}
#mainControls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
#infoBoxes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.infoBox{background:#e3f1ff;padding:10px 16px;border-radius:10px;font-weight:bold;font-size:18px}
table{width:95%;margin:auto;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ccc;padding:6px;font-weight:bold}
th{background:#eee}
.correct{color:green}.wrong{color:red}
footer{margin:14px auto;background:#1e3c72;color:#fff;border-radius:12px;padding:10px;font-size:26px;width:95%}
#versionInfo{font-size:16px}
</style>
</head>
<body><div id="passwordOverlay">
  <h2>请输入访问密码</h2>
  <input type="password" id="passwordInput" placeholder="密码">
  <button onclick="checkPassword()">提交</button>
  <div id="passwordError"></div>
</div><div id="mainContent" style="display:none">
  <h1>杀组28 @SZ28BOT</h1>  <div id="mainControls">
    <select id="algorithmSelect">
      <option value="1">算法1</option>
      <option value="2">算法2</option>
    </select>
    <button onclick="loadData()">刷新数据</button>
  </div>  <div id="infoBoxes">
    <div class="infoBox" id="nextPred">加载中…</div>
    <div class="infoBox" id="winRate">--</div>
  </div>  <h3>最近 50 期</h3>
  <table id="historyTable">
    <tr><th>期号</th><th>预测</th><th>和值</th><th>结果</th></tr>
  </table>  <footer>
    BY CKY @cky_nb
    <div id="versionInfo">杀组28 v1.1.7</div>
  </footer>
</div><script>
/* ===== 密码 ===== */
const passwordList = ['sz28test1','sz28test2','sz28test3'];
function checkPassword(){
  const v = document.getElementById('passwordInput').value;
  if(passwordList.includes(v)){
    localStorage.setItem('sz28_pass','1');
    passwordOverlay.style.display='none';
    mainContent.style.display='block';
    loadData();
  }else{
    passwordError.innerText='密码错误';
  }
}
window.onload=()=>{
  if(localStorage.getItem('sz28_pass')==='1'){
    passwordOverlay.style.display='none';
    mainContent.style.display='block';
    loadData();
  }
};

/* ===== 工具 ===== */
const sum = arr=>arr.reduce((a,b)=>a+b,0);
function checkWin(pred,total){
  const size = total>=14?'大':'小';
  const parity = total%2?'单':'双';
  return pred!==('杀'+size+parity)?'✅':'❌';
}

function calcAlgo(last3,mode){
  const k = mode===1?0.28:4;
  const div = mode===1?3:28;
  let a = 0;
  for(const n of last3){ a += (sum(n)+n[0]) / k; }
  const c = Math.sqrt(a)/div;
  const ds = c.toFixed(3).split('.')[1].split('').reduce((s,d)=>s+Number(d),0);
  if(ds<14) return ds%2?'杀大单':'杀大双';
  return ds%2?'杀小单':'杀小双';
}

async function loadData(){
  nextPred.innerText='加载中…';
  winRate.innerText='--';
  try{
    const r = await fetch('https://pc28.help/kj.json?limit=120',{cache:'no-store'});
    const j = await r.json();
    if(!j || !Array.isArray(j.data)) throw 'API结构异常';

    const map = {};
    for(const it of j.data){
      if(!it.qihao||!it.opennum) continue;
      const nums = it.opennum.split('+').map(Number);
      if(nums.length!==3||nums.some(isNaN)) continue;
      map[Number(it.qihao)] = nums;
    }

    const qs = Object.keys(map).map(Number).sort((a,b)=>b-a);
    const tbl = document.getElementById('historyTable');
    tbl.innerHTML='<tr><th>期号</th><th>预测</th><th>和值</th><th>结果</th></tr>';

    let win = 0;
    const mode = Number(algorithmSelect.value);

    for(let i=0;i<50;i++){
      const cur = qs[i];
      if(!cur) continue;
      const last3 = [];
      for(let j=i+1;j<i+4;j++) if(qs[j]) last3.push(map[qs[j]]);
      if(last3.length<3) continue;

      const pred = calcAlgo(last3,mode);
      const total = sum(map[cur]);
      const res = checkWin(pred,total);
      if(res==='✅') win++;
      tbl.insertAdjacentHTML('beforeend',
        `<tr><td>${cur}</td><td>${pred}</td><td>${total}</td><td class="${res==='✅'?'correct':'wrong'}">${res}</td></tr>`
      );
    }

    winRate.innerText = `胜率 ${(win/50*100).toFixed(1)}%`;
    const next3 = qs.slice(0,3).map(q=>map[q]);
    nextPred.innerText = '下一期预测：'+calcAlgo(next3,mode);

  }catch(e){
    console.error(e);
    nextPred.innerText='加载失败';
  }
}
</script></body>
</html>
